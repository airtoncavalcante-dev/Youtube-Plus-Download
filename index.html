:root {
  --bg: #08080f;
  --bg-2: #0f0f1e;
  --surface: #16162a;
  --surface-2: #1e1e36;
  --surface-3: #272749;
  --border: #2a2a4a;
  --border-2: #3a3a5c;
  --text: #f5f5ff;
  --text-dim: #9a9ab8;
  --text-faint: #5a5a7a;
  --purple: #8b5cf6;
  --purple-bright: #a78bfa;
  --blue: #3b82f6;
  --blue-bright: #60a5fa;
  --pink: #ec4899;
  --green: #10b981;
  --yellow: #f59e0b;
  --red: #ef4444;
  --gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
  --gradient-soft: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(59,130,246,0.15) 50%, rgba(6,182,214,0.15) 100%);
  --shadow-glow: 0 0 40px rgba(139,92,246,0.25);
  --radius: 16px;
}

* {
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
}

.mono {
  font-family: 'Geist Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  overflow-x: clip;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: 999px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

@keyframes float {
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes pulse-glow {
  0%,100%{
    box-shadow:0 0 20px rgba(139,92,246,0.3)
  }

  50%{
    box-shadow:0 0 40px rgba(139,92,246,0.5)
  }
}

@keyframes shimmer {
  0%{
    background-position:-200% 0
  }

  100%{
    background-position:200% 0
  }
}

.placeholder\:text-\[var\(--text-faint\)\]::-moz-placeholder{
  color: var(--text-faint);
}

.placeholder\:text-\[var\(--text-faint\)\]::placeholder{
  color: var(--text-faint);
}

.focus-within\:border-\[var\(--purple\)\]:focus-within{
  border-color: var(--purple);
}

.hover\:scale-\[1\.01\]:hover{
  --tw-scale-x: 1.01;
  --tw-scale-y: 1.01;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:scale-\[1\.02\]:hover{
  --tw-scale-x: 1.02;
  --tw-scale-y: 1.02;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[var\(--border-2\)\]:hover{
  border-color: var(--border-2);
}

.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}

.hover\:bg-\[var\(--surface-3\)\]:hover{
  background-color: var(--surface-3);
}

.hover\:bg-zinc-100:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(244 244 245 / var(--tw-bg-opacity, 1));
}

.focus\:border-\[var\(--purple\)\]:focus{
  border-color: var(--purple);
}

.active\:scale-\[0\.99\]:active{
  --tw-scale-x: 0.99;
  --tw-scale-y: 0.99;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:cursor-not-allowed:disabled{
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

.group:hover .group-hover\:opacity-100{
  opacity: 1;
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:w-\[180px\]{
    width: 180px;
  }

  .md\:grid-cols-\[1\.15fr_0\.85fr\]{
    grid-template-columns: 1.15fr 0.85fr;
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:gap-8{
    gap: 2rem;
  }

  .md\:p-4{
    padding: 1rem;
  }

  .md\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .md\:py-12{
    padding-top: 3rem;
    padding-bottom: 3rem;
  }

  .md\:text-\[44px\]{
    font-size: 44px;
  }
}

import express from 'express';
import cors from 'cors';
import { exec } from 'child_process';
import fs from 'fs';
import path from 'path';
import { fileURLToPath } from 'url';

const __dirname = path.dirname(fileURLToPath(import.meta.url));
const app = express();
app.use(cors());
app.use(express.json());
app.use(express.static('public'));

app.post('/api/download', async (req, res) => {
  const { url, quality = '192', isPlaylist = false } = req.body;
  if(!url) return res.status(400).json({ error: 'URL obrigatória' });
  const outDir = path.join(__dirname, 'downloads');
  if(!fs.existsSync(outDir)) fs.mkdirSync(outDir);

  const qMap = { '128':'128', '192':'192', '320':'320' };
  const bitrate = qMap[quality] || '192';
  
  const cmd = \`yt-dlp -x --audio-format mp3 --audio-quality \${bitrate}K \\
    --no-playlist="\${!isPlaylist}" -o "\${outDir}/%(title)s.%(ext)s" \\
    --cookies cookies.txt \\
    "\${url}"\`;

  exec(cmd, (err, stdout, stderr) => {
    if(err) return res.status(500).json({ error: stderr || err.message });
    const files = fs.readdirSync(outDir).filter(f=>f.endsWith('.mp3'));
    res.json({ message: 'Download concluído', files, log: stdout });
  });
});

app.get('/api/file/:name', (req,res)=>{
  const p = path.join(__dirname, 'downloads', req.params.name);
  if(!fs.existsSync(p)) return res.status(404).send('Not found');
  res.download(p);
});

const PORT = process.env.PORT || 3000;
app.listen(PORT, ()=> console.log('YT Plus Backend rodando na porta', PORT));
